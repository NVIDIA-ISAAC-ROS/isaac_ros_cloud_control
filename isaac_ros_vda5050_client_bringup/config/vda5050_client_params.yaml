action_handlers:
  - docking
  - pick_and_place
  - scene_recorder
  - gr00t_policy
  - apriltag
  - map_handler
docking:
  plugin: isaac_ros::mission_client::DockingHandler
  action_types:
    - dock_robot
    - undock_robot
  use_switch: true
pick_and_place:
  plugin: isaac_ros::mission_client::PickAndPlaceHandler
  action_types:
    - pick_place
    - get_objects
    - clear_objects
    - multi_object_pick_and_place
scene_recorder:
  plugin: isaac_ros::mission_client::SceneRecorderHandler
  action_types:
    - start_recording
    - stop_recording
gr00t_policy:
  plugin: isaac_ros::mission_client::Gr00tPolicyActionHandler
  action_types:
    - gr00t_manipulation
  action_server_name: "humanoid_task"
  default_timeout: 30.0

apriltag:
  plugin: isaac_ros::mission_client::AprilTagHandler
  action_types:
    - get_apriltags
  apriltag_detections_topic: "tag_detections"
  apriltag_detection_buffer_time: 1.0    # Time to collect unique detections
  apriltag_action_timeout: 5.0           # Total action timeout
  apriltag_target_frame: ""
  apriltag_transform_mode: "static"
  apriltag_transform_timeout: 1.0
  apriltag_collection_strategy: "most_recent"
  verbose: false
map_handler:
  plugin: isaac_ros::mission_client::MapHandler
  action_types:
    - downloadMap
    - enableMap
  map_storage_root: /workspaces/isaac_ros-dev/ros_ws/src/isaac_ros_cloud_control/downloaded_maps
  map_server_load_service: /map_server/load_map
  amcl_global_localization_service: /amcl/global_localization
  amcl_reinitialize_global_localization_service: /reinitialize_global_localization
  amcl_global_localization_retry_seconds: 30.0

